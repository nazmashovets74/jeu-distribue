<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Le jeu de l'espion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="vaisseau etroit">
    <header class="tete"><h1>Le jeu de l'espion</h1></header>
    <section class="panneau">
      <h2>Connexion</h2>
      {% if aucun_compte %}
        <p class="erreur">Aucun compte. Sur la machine du site :
          <code>venv/bin/python -m web.comptes ajouter &lt;nom&gt; --capteurs 2</code></p>
      {% endif %}
      {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
      <form method="post" class="formulaire">
        <input name="nom" placeholder="nom" autocomplete="username" required autofocus>
        <input name="mot_de_passe" type="password" placeholder="mot de passe" autocomplete="current-password" required>
        <button class="bouton" type="submit">Entrer</button>
      </form>
    </section>
    <a class="lien" href="{{ url_for('accueil') }}">regarder sans se connecter</a>
  </main>
</body>
</html>
