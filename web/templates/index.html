<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le jeu de l'espion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="vaisseau">
    <header class="tete">
      <h1>Le jeu de l'espion</h1>
      <span class="discret" id="serveur">serveur hors ligne</span>
    </header>

    <section class="panneau statut">
      <span id="phase">En attente</span>
    </section>

    <section id="resultat" class="panneau resultat" hidden></section>

    <section class="panneau">
      <h2>Capteurs</h2>
      <ul class="capteurs" id="capteurs"></ul>
    </section>

    <section class="panneau">
      <h2>Terminal</h2>
      <ol class="journal" id="journal"></ol>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
