<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le jeu de l'espion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="vaisseau">
    <header class="tete">
      <h1>Le jeu de l'espion</h1>
      <div class="compte">
        {% if joueur %}
          <strong>{{ joueur }}</strong>
          <form method="post" action="{{ url_for('deconnexion') }}">
            <button class="lien" type="submit">déconnexion</button>
          </form>
        {% else %}
          <a class="lien" href="{{ url_for('connexion') }}">connexion</a>
        {% endif %}
      </div>
    </header>

    <section class="panneau statut">
      <span id="phase">En attente</span>
    </section>

    <section id="resultat" class="panneau resultat" hidden></section>

    <section class="panneau">
      <h2>Capteurs</h2>
      <ul class="capteurs" id="capteurs"></ul>
    </section>

    <section class="panneau">
      <h2>Prêts</h2>
      <div class="prets">
        <ul class="joueurs" id="joueurs"></ul>
        {% if joueur %}<button id="bouton-pret" class="bouton" type="button">Prêt</button>{% endif %}
      </div>
      <p id="attente" class="discret"></p>
      <p id="erreur" class="erreur" hidden></p>
    </section>

    <section class="panneau">
      <h2>Journal</h2>
      <ol class="journal" id="journal"></ol>
    </section>
  </main>

  <script>
    window.JOUEUR = {{ joueur|tojson }};
    window.MES_CAPTEURS = {{ capteurs|tojson }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
